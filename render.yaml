services:
  - type: web
    name: carwash-backend
    runtime: node
    plan: free
    # This blueprint lives at the root of a backend-only repo (deliberately
    # split out of the mobile+server monorepo for this deploy) — no rootDir.
    #
    # Migrations run on every deploy, not just the first: `knex migrate:latest`
    # only applies migrations that haven't run yet, so a redeploy with no new
    # migration files is a safe no-op.
    #
    # Seeding is left out of the build command, though no longer because it is
    # dangerous — both seeders are idempotent now and only add what is missing,
    # so repeating them changes nothing. It stays out because seeding a fresh
    # database once, deliberately, is clearer than doing it on every deploy;
    # run `npm run seed` from Render's shell after the first deploy.
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: SEED_SYSADMIN_EMAIL
        sync: false
      - key: SEED_SYSADMIN_PASSWORD
        sync: false
      - key: SEED_SYSADMIN_USERNAME
        sync: false
      - key: NODE_ENV
        value: production
