services:
  - type: web
    name: carwash-backend
    runtime: node
    plan: free
    # This blueprint lives at the root of a backend-only repo (deliberately
    # split out of the mobile+server monorepo for this deploy) — no rootDir.
    #
    # Migrations run on every deploy, not just the first: `knex migrate:latest`
    # only applies migrations that haven't run yet, so a redeploy with no new
    # migration files is a safe no-op. Seeding is NOT run here on purpose —
    # `npm run seed` is meant to run once against an empty database (it would
    # duplicate or fight with real data on every subsequent deploy) — run it
    # manually from Render's shell after the very first successful deploy.
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: SEED_SYSADMIN_EMAIL
        sync: false
      - key: SEED_SYSADMIN_PASSWORD
        sync: false
      - key: SEED_SYSADMIN_USERNAME
        sync: false
      - key: NODE_ENV
        value: production
